    - region [ref=e288]:
      - generic [ref=e289]:
        - generic [ref=e290]:
          - paragraph [aria-hidden] [ref=e291]: The Pecunia Approach
          - heading "The Pecunia Approach" [level=2] [ref=e292]
          - paragraph [ref=e293]: We don't sell activity. We build for outcomes.
          - paragraph [ref=e294]: Anyone can launch a campaign. Anyone can build a website. Anyone can generate content. The difference is whether those things actually contribute to growth. Our process starts with the commercial objective and works backwards.
        - list [ref=e295]:
          - listitem [ref=e296]:
            - heading "01 — Diagnose" [level=3] [ref=e297]
            - paragraph [ref=e298]: We analyse the business, market, offer, customer journey, competitors and existing performance. We identify what's working. More importantly, we identify what's leaking.
          - listitem [ref=e299]:
            - heading "02 — Strategise" [level=3] [ref=e300]
            - paragraph [ref=e301]: We establish the growth model. Who are we trying to acquire? Which channels should reach them? What should they see? Where should they land? What happens next? What needs to be true for acquisition to be profitable?
            - paragraph [ref=e302]: Every decision starts with the numbers.
          - listitem [ref=e303]:
            - heading "03 — Build" [level=3] [ref=e304]
            - paragraph [ref=e305]: We build the infrastructure required to execute the strategy. Websites. Landing pages. Funnels. CRM systems. Automations. Tracking. Creative. Campaigns. E-commerce systems.
            - paragraph [ref=e306]: Everything has a role. Everything connects back to the objective.
          - listitem [ref=e307]:
            - heading "04 — Launch" [level=3] [ref=e308]
            - paragraph [ref=e309]: Strategy means nothing until it meets the market. We launch. We measure. We collect real-world data. Then we use that data to understand what the market actually responds to.
          - listitem [ref=e310]:
            - heading "05 — Optimise" [level=3] [ref=e311]
            - paragraph [ref=e312]: Launching is the beginning, not the finish line. We continuously analyse acquisition, conversion and customer behaviour. Creative gets tested. Offers get refined. Landing pages get improved. Campaigns get restructured. Budgets move towards what performs.
          - listitem [ref=e313]:
            - heading "06 — Scale" [level=3] [ref=e314]
            - paragraph [ref=e315]: Once we identify what works, we build on it. More qualified traffic. More efficient acquisition. More conversions. More automation. More capacity.
            - paragraph [ref=e316]: The objective isn't to make something work once. It's to build something that can scale.
    - region [ref=e317]:
